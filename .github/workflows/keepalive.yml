name: SnapDeploy Keep Alive

on:
  schedule:
    - cron: '*/8 * * * *'  # Ping every 8 minutes
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping SearXNG with Retry on 503
        run: |
          # --retry 3 handles cold-start 503s while SnapDeploy wakes up
          curl --retry 3 --retry-delay 10 --retry-connrefused -s -f \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" \
            "https://searxng-ed685.containers.snapdeploy.app/search?q=healthcheck&format=json" > /dev/null