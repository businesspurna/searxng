name: SnapDeploy Keep Alive

on:
  schedule:
    - cron: '*/8 * * * *'  # Ping every 8 minutes
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Keep Alive Ping
        run: |
          TIMESTAMP=$(date +%s)
          curl -s -A "Mozilla/5.0" \
            "https://searxng-ed685.containers.snapdeploy.app/search?q=ping_${TIMESTAMP}&format=json" > /dev/null
